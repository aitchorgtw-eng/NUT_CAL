<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>麥子膳食採購精算系統 - 多功能匯入版</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
/* index.css - Premium Catering Procurement System Stylesheet */
@import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

:root {
    --bg-main: #0b0f19;
    --bg-card: rgba(23, 32, 53, 0.65);
    --bg-card-hover: rgba(30, 41, 69, 0.85);
    --border-color: rgba(255, 255, 255, 0.08);
    --text-primary: #f3f4f6;
    --text-secondary: #9ca3af;
    --primary: #f59e0b; /* Amber */
    --primary-glow: rgba(245, 158, 11, 0.35);
    --success: #10b981; /* Emerald */
    --success-glow: rgba(16, 185, 129, 0.35);
    --info: #3b82f6; /* Blue */
    --info-glow: rgba(59, 130, 246, 0.35);
    --danger: #ef4444;
    --font-sans: 'Outfit', 'Noto Sans TC', system-ui, sans-serif;
    --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: var(--bg-main);
    color: var(--text-primary);
    font-family: var(--font-sans);
    min-height: 100dvh;
    background-image: 
        radial-gradient(at 0% 0%, rgba(245, 158, 11, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 0%, rgba(16, 185, 129, 0.05) 0px, transparent 50%),
        radial-gradient(at 50% 100%, rgba(59, 130, 246, 0.05) 0px, transparent 50%);
    overflow-x: hidden;
    padding-bottom: 50px;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 20px 24px;
}

/* Header Section */
header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 0 20px 0;
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 25px;
}

.brand-section h1 {
    font-size: 2.2rem;
    font-weight: 700;
    background: linear-gradient(135deg, #fff 30%, var(--primary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.5px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.brand-section p {
    color: var(--text-secondary);
    font-size: 0.95rem;
    margin-top: 6px;
}

.global-controls {
    display: flex;
    align-items: center;
    gap: 20px;
}

/* Toggle Switch */
.unit-toggle-container {
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-color);
    padding: 4px;
    border-radius: 30px;
}

.unit-btn {
    padding: 8px 18px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: 20px;
    cursor: pointer;
    transition: var(--transition);
}

.unit-btn.active {
    background: var(--primary);
    color: #0b0f19;
    box-shadow: 0 4px 12px var(--primary-glow);
}

/* Import Panel */
.import-card {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 25px;
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: stretch;
}

.upload-box {
    flex: 1;
    min-width: 250px;
    background: rgba(255, 255, 255, 0.01);
    border: 1px dashed var(--border-color);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    position: relative;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
}

.upload-box:hover {
    border-color: var(--primary);
    background: rgba(245, 158, 11, 0.02);
}

.upload-box input[type="file"] {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
}

.upload-box i {
    font-size: 1.6rem;
    color: var(--primary);
    margin-bottom: 6px;
}

.upload-box p {
    font-size: 0.9rem;
    font-weight: 600;
}

.upload-box span {
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-top: 3px;
}

.sheet-selector-container {
    flex: 1;
    min-width: 220px;
    background: rgba(255, 255, 255, 0.01);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    justify-content: center;
}

.sheet-selector-container label {
    font-size: 0.85rem;
    color: var(--text-secondary);
    font-weight: 600;
    margin-bottom: 6px;
}

.sheet-selector-container select {
    background: #0f172a;
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 10px;
    border-radius: 6px;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: var(--font-sans);
}

/* Tab Navigation */
.view-tabs {
    display: flex;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 6px;
    margin-bottom: 25px;
    gap: 4px;
}

/* Date Tabs Ribbon (Horizontal Scroll for Daily) */
.date-tabs.daily-select {
    display: flex;
    overflow-x: auto;
    gap: 10px;
    padding-bottom: 10px;
    margin-bottom: 25px;
    scrollbar-width: thin;
    scrollbar-color: rgba(245, 158, 11, 0.3) transparent;
}

.date-tabs.daily-select::-webkit-scrollbar {
    height: 6px;
}

.date-tabs.daily-select::-webkit-scrollbar-thumb {
    background: rgba(245, 158, 11, 0.2);
    border-radius: 3px;
}

.date-tabs.daily-select::-webkit-scrollbar-thumb:hover {
    background: rgba(245, 158, 11, 0.4);
}

.date-tabs.daily-select .date-btn {
    flex: 0 0 auto;
    min-width: 120px;
}

/* Date Tabs List for Weekly checkboxes */
.date-tabs.weekly-select {
    display: block;
    margin-bottom: 25px;
}

.date-btn {
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--border-color);
    padding: 10px 14px;
    border-radius: 12px;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: var(--transition);
}

.date-btn:hover {
    background: rgba(255, 255, 255, 0.05);
    border-color: var(--primary);
}

.date-btn.active {
    background: rgba(245, 158, 11, 0.08);
    border-color: var(--primary);
    color: var(--text-primary);
    box-shadow: 0 4px 15px var(--primary-glow);
}

.date-lbl {
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 2px;
}

.date-btn.active .date-lbl {
    color: var(--primary);
}

.date-val {
    font-size: 0.95rem;
    font-weight: 600;
}

.tab-btn {
    flex: 1;
    padding: 12px 24px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-size: 1rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: var(--transition);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
}

.tab-btn.active {
    background: rgba(255, 255, 255, 0.07);
    color: var(--text-primary);
    border-left: 3px solid var(--primary);
}

/* Grid Layouts */
.dashboard-grid {
    display: grid;
    grid-template-columns: 350px 1fr;
    gap: 25px;
    margin-bottom: 30px;
}

@media (max-width: 1100px) {
    .dashboard-grid {
        grid-template-columns: 1fr;
    }
}

/* Card Styling */
.card {
    background: var(--bg-card);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 24px;
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    transition: var(--transition);
}

.card:hover {
    border-color: rgba(255, 255, 255, 0.12);
}

.card-title {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
    border-left: 3px solid var(--primary);
    padding-left: 10px;
}

/* Checkbox Date Selector List */
.date-checkbox-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
    max-height: 250px;
    overflow-y: auto;
    padding-right: 4px;
}

.date-checkbox-item {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(255, 255, 255, 0.01);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: 10px 14px;
    cursor: pointer;
    transition: var(--transition);
    user-select: none;
}

.date-checkbox-item:hover {
    background: rgba(255, 255, 255, 0.04);
}

.date-checkbox-item.checked {
    border-color: var(--primary);
    background: rgba(245, 158, 11, 0.06);
}

.date-checkbox-item input[type="checkbox"] {
    accent-color: var(--primary);
    width: 17px;
    height: 17px;
    cursor: pointer;
}

.date-checkbox-info {
    display: flex;
    flex-direction: column;
}

.date-checkbox-lbl {
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-bottom: 2px;
}

.date-checkbox-val {
    font-size: 0.95rem;
    font-weight: 600;
}

.date-checkbox-actions {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
}

.btn-sm {
    padding: 6px 12px;
    font-size: 0.8rem;
    border-radius: 6px;
    border: 1px solid var(--border-color);
    background: rgba(255, 255, 255, 0.03);
    color: var(--text-primary);
    cursor: pointer;
    font-weight: 500;
    transition: var(--transition);
}

.btn-sm:hover {
    background: rgba(255, 255, 255, 0.08);
}

/* Meal Counts Card */
.count-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.count-row:last-child {
    border-bottom: none;
    font-weight: 700;
    color: var(--primary);
    font-size: 1.1rem;
    margin-top: 10px;
}

.count-name {
    color: var(--text-secondary);
    font-size: 0.95rem;
}

.count-val {
    font-weight: 600;
    font-size: 1.1rem;
}

/* Vegetable Selector */
.veg-selector-card select {
    width: 100%;
    background: #0f172a;
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 12px;
    border-radius: 8px;
    font-size: 0.95rem;
    margin-top: 10px;
    cursor: pointer;
    font-family: var(--font-sans);
}

.veg-info {
    margin-top: 15px;
    font-size: 0.85rem;
    color: var(--text-secondary);
    line-height: 1.5;
    background: rgba(255, 255, 255, 0.02);
    padding: 12px;
    border-radius: 8px;
    border-left: 2px solid var(--success);
}

/* Suggestion Card */
.suggestion-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.suggestion-item {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    line-height: 1.5;
    font-size: 0.9rem;
    color: var(--text-secondary);
}

.suggestion-item i {
    color: var(--primary);
    margin-top: 3px;
}

/* Main Table Container */
.table-card {
    grid-column: 2;
}

@media (max-width: 1100px) {
    .table-card {
        grid-column: 1;
    }
}

.table-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 10px;
}

.table-search {
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--border-color);
    padding: 8px 16px;
    border-radius: 20px;
    color: var(--text-primary);
    font-size: 0.9rem;
    width: 250px;
    font-family: var(--font-sans);
}

.table-search::placeholder {
    color: var(--text-secondary);
}

.table-wrapper {
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid rgba(255, 255, 255, 0.05);
}

table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-size: 0.9rem;
}

th, td {
    padding: 14px 16px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

th {
    background: rgba(255, 255, 255, 0.02);
    color: var(--text-secondary);
    font-weight: 600;
}

tr:hover td {
    background: rgba(255, 255, 255, 0.01);
}

.cat-badge {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 0.75rem;
    font-weight: 700;
    display: inline-block;
}

.cat-starch { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
.cat-main { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
.cat-side1 { background: rgba(16, 185, 129, 0.15); color: #34d399; }
.cat-side2 { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
.cat-veg { background: rgba(236, 72, 153, 0.15); color: #f472b6; }
.cat-soup { background: rgba(20, 184, 166, 0.15); color: #2dd4bf; }

/* Vendor Badges */
.badge-vendor-fruitveg { background: rgba(16, 185, 129, 0.15); color: #34d399; }
.badge-vendor-soyegg { background: rgba(245, 158, 11, 0.15); color: #fbbf24; }
.badge-vendor-fish { background: rgba(6, 182, 212, 0.15); color: #22d3ee; }
.badge-vendor-pork { background: rgba(244, 63, 94, 0.15); color: #fb7185; }
.badge-vendor-rice { background: rgba(139, 92, 246, 0.15); color: #a78bfa; }
.badge-vendor-other { background: rgba(148, 163, 184, 0.15); color: #cbd5e1; }

.text-right {
    text-align: right;
}

.qty-highlight {
    font-weight: 700;
    color: var(--primary);
}

/* Grand Summary Block */
.grand-summary-section {
    margin-top: 30px;
}

.action-bar {
    display: flex;
    justify-content: flex-end;
    gap: 15px;
    margin-top: 25px;
}

.btn {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.95rem;
    transition: var(--transition);
    font-family: var(--font-sans);
}

.btn-primary {
    background: var(--primary);
    color: #0b0f19;
    box-shadow: 0 4px 14px var(--primary-glow);
}

.btn-primary:hover {
    background: #e08e0a;
    transform: translateY(-1px);
}

.btn-secondary {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
}

.btn-secondary:hover {
    background: rgba(255, 255, 255, 0.08);
}

/* Print Styles */
@media print {
    body {
        background: #fff !important;
        color: #000 !important;
        font-size: 11pt !important;
        padding: 0 !important;
    }
    
    .container {
        max-width: 100% !important;
        padding: 0 !important;
    }
    
    header, .view-tabs, .date-tabs, .global-controls, .action-bar, .veg-selector-card, .table-search, .import-card, .date-checkbox-actions, .table-search-box, #search-clear-btn {
        display: none !important;
    }
    
    thead {
        display: table-header-group !important;
    }
    
    tr {
        page-break-inside: avoid !important;
    }
    
    .dashboard-grid {
        display: block !important;
    }
    
    .card {
        border: none !important;
        box-shadow: none !important;
        background: none !important;
        padding: 0 !important;
        margin-bottom: 30px !important;
        page-break-inside: avoid;
    }
    
    .table-card {
        page-break-before: always;
    }
    
    table {
        border: 1px solid #ccc !important;
    }
    
    th {
        background: #f0f0f0 !important;
        color: #000 !important;
        border-bottom: 2px solid #ccc !important;
    }
    
    td {
        border-bottom: 1px solid #eee !important;
        color: #000 !important;
    }
    
    .qty-highlight {
        color: #000 !important;
        font-weight: 700 !important;
    }
}

    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand-section">
                <h1><i class="fa-solid fa-wheat-awn"></i> 麥子膳食採購精算系統</h1>
                <p>自訂 Excel 匯入與多日期合計採購叫貨量 ｜ 免裝軟體離線版</p>
            </div>
            
            <div class="global-controls" style="display: flex; gap: 15px; align-items: center;">
                <!-- Grouping Toggle -->
                <div class="unit-toggle-container">
                    <button id="btn-group-cat" class="unit-btn active" onclick="setGroupingMode('category')">依菜色類別</button>
                    <button id="btn-group-vendor" class="unit-btn" onclick="setGroupingMode('vendor')">依採購廠商</button>
                </div>

                <!-- Unit Switcher -->
                <div class="unit-toggle-container">
                    <button id="btn-unit-taijin" class="unit-btn active" onclick="setUnit('taijin')">台斤 (600g)</button>
                    <button id="btn-unit-g" class="unit-btn" onclick="setUnit('g')">公克 / 公斤</button>
                </div>
            </div>
        </header>

        <!-- Excel Import Management Card -->
        <div class="import-card card">
            <!-- Upload Menu -->
            <div class="upload-box">
                <i class="fa-solid fa-file-import"></i>
                <p>① 匯入菜單 Excel 檔</p>
                <span>點擊上傳一週/月菜單對照表 (.xlsx)</span>
                <input type="file" id="menu-file-input" accept=".xlsx, .xls" onchange="handleMenuUpload(event)">
            </div>
            
            <!-- Upload Counts -->
            <div class="upload-box">
                <i class="fa-solid fa-file-invoice"></i>
                <p>② 匯入人數 Excel 統計表</p>
                <span>點擊對應月份供膳人次統計表 (.xls)</span>
                <input type="file" id="counts-file-input" accept=".xls, .xlsx" onchange="handleCountsUpload(event)">
            </div>

            <!-- Sheet Selector -->
            <div class="sheet-selector-container" id="sheet-select-container" style="display: none;">
                <label for="sheet-select">選擇菜單月份 (Sheet)：</label>
                <select id="sheet-select" onchange="handleSheetChange(this)">
                    <!-- Dynamic -->
                </select>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="view-tabs">
            <button id="tab-daily" class="tab-btn active" onclick="setViewMode('daily')">
                <i class="fa-solid fa-calendar-day"></i> 單日明細 (Daily View)
            </button>
            <button id="tab-weekly" class="tab-btn" onclick="setViewMode('weekly')">
                <i class="fa-solid fa-calendar-check"></i> 多日合計 (Multi-day Sum)
            </button>
        </div>

        <!-- Date Tabs / Checkbox list Container -->
        <div id="date-tabs-container" style="margin-bottom: 25px;">
            <!-- Dynamic dates or checkboxes -->
        </div>

        <!-- Main Content Grid -->
        <div class="dashboard-grid">
            <!-- Left Sidebar Controls -->
            <div class="sidebar-column" style="display: flex; flex-direction: column; gap: 20px;">
                <!-- Meal Counts Card -->
                <div class="card count-card">
                    <h2 class="card-title"><i class="fa-solid fa-users"></i> 供餐人數統計</h2>
                    <div id="meal-counts-list">
                        <!-- Dynamic content -->
                    </div>
                </div>

                <!-- Vegetable Selector Card -->
                <div class="card veg-selector-card">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px;">
                        <h2 class="card-title" style="margin-bottom: 0;"><i class="fa-solid fa-carrot"></i> 季節蔬菜選擇</h2>
                        <label class="btn-sm" style="cursor: pointer; background: rgba(245, 158, 11, 0.15); color: var(--primary); border: 1px solid rgba(245, 158, 11, 0.35); padding: 5px 12px; border-radius: 6px; font-size: 0.82rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: var(--transition);">
                            <i class="fa-solid fa-file-excel"></i> 匯入報價單
                            <input type="file" id="quotation-file-input" accept=".xls, .xlsx" style="display: none;" onchange="handleQuotationUpload(event)">
                        </label>
                    </div>
                    <label style="display: block; cursor: pointer; margin-bottom: 14px;">
                        <div id="quotation-status-bar" style="padding: 8px 12px; background: rgba(245, 158, 11, 0.06); border: 1px dashed rgba(245, 158, 11, 0.3); border-radius: 8px; font-size: 0.8rem; color: var(--text-secondary); display: flex; justify-content: space-between; align-items: center;">
                            <span id="quotation-status-text"><i class="fa-solid fa-circle-check" style="color: var(--success); margin-right: 5px;"></i>已載入 9月份蔬菜報價單品項</span>
                            <span id="quotation-count-badge" style="background: rgba(245, 158, 11, 0.2); color: var(--primary); padding: 2px 8px; border-radius: 12px; font-weight: 700; font-size: 0.75rem;">60 項蔬菜</span>
                        </div>

function getChineseDayName(dateStr) {
    if (!dateStr) return "";
    const parts = dateStr.split('-');
    const y = parseInt(parts[0]);
    const m = parseInt(parts[1]) - 1;
    const d = parseInt(parts[2]);
    const dateObj = new Date(y, m, d);
    const days = ["星期日", "星期一", "星期二", "星期三", "星期四", "星期五", "星期六"];
    return days[dateObj.getDay()];
}

// Helper: Excel date serial converter
function excelSerialToDateString(serial) {
    const utc_days  = Math.floor(serial - 25569);
    const utc_value = utc_days * 86400;
    const date_info = new Date(utc_value * 1000);
    const tzOffset = date_info.getTimezoneOffset() * 60000;
    const localDate = new Date(date_info.getTime() + tzOffset);
    const y = localDate.getFullYear();
    const m = String(localDate.getMonth() + 1).padStart(2, '0');
    const d = String(localDate.getDate()).padStart(2, '0');
    return `${y}-${m}-${d}`;
}

function handleMenuUpload(event) {

    if (!file) return;

    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array', cellDates: true});
            
            const select = document.getElementById('sheet-select');
            select.innerHTML = '';
            
            const sheetNames = workbook.SheetNames;
            sheetNames.forEach(name => {
                const opt = document.createElement('option');
                opt.value = name;
                opt.innerText = name;
                select.appendChild(opt);
            });
            
            window.menuWorkbook = workbook;
            document.getElementById('sheet-select-container').style.display = 'flex';
            
            let defaultSheet = sheetNames[0];
            let maxScore = -1;
            sheetNames.forEach(name => {
                let year = 115;
                let month = 1;
                const yearMatch = name.match(/(\d+)年/);
                if (yearMatch) {
                    year = parseInt(yearMatch[1]);
                }
                const monthMatch = name.match(/(\d+)月/);
                if (monthMatch) {
                    month = parseInt(monthMatch[1]);
                } else {
                    const chineseMonths = ["", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十", "十一", "十二"];
                    for (let i = 12; i >= 1; i--) {
                        if (name.includes(chineseMonths[i] + "月")) {
                            month = i;
                            break;
                        }
                    }
                }
                const score = year * 100 + month;
                if (score > maxScore) {
                    maxScore = score;
                    defaultSheet = name;
                }
            });
            select.value = defaultSheet;
            
            parseMenuSheet(defaultSheet);
            alert("菜單 Excel 讀取成功！");
        } catch(err) {
            console.error(err);
            alert("菜單 Excel 解析失敗，請確認檔案格式是否正確。");
        }
    };
    reader.readAsArrayBuffer(file);
}

function parseMenuSheet(sheetName) {
    const workbook = window.menuWorkbook;
    if (!workbook) return;
    
    const sheet = workbook.Sheets[sheetName];
    if (!sheet || !sheet['!ref']) {
        alert("所選的菜單工作表「" + sheetName + "」無內容或格式不正確！");
        return;
    }
    const range = XLSX.utils.decode_range(sheet['!ref']);
    const maxRow = range.e.r + 1;
    const maxCol = range.e.c + 1;
    
    // Scan Row 1 (0-indexed) for date strings
    const dateCols = {};
    for (let c = 2; c < maxCol; c++) {
        const dateCell = sheet[XLSX.utils.encode_cell({r: 1, c: c})];
        if (dateCell && dateCell.v) {
            let dateStr = "";
            if (dateCell.t === 'd') {
                const d = dateCell.v;
                const y = d.getFullYear();
                const m = String(d.getMonth() + 1).padStart(2, '0');
                const day = String(d.getDate()).padStart(2, '0');
                dateStr = `${y}-${m}-${day}`;
            } else if (typeof dateCell.v === 'number') {
                dateStr = excelSerialToDateString(dateCell.v);
            } else {
                dateStr = String(dateCell.v).trim();
            }
            
            const m = dateStr.match(/^(\d{3,4})[-/.](\d{1,2})[-/.](\d{1,2})/);
            if (m) {
                let year = parseInt(m[1]);
                if (year < 1000) year += 1911;
                const month = m[2].padStart(2, '0');
                const day = m[3].padStart(2, '0');
                const cleanDate = `${year}-${month}-${day}`;
                dateCols[cleanDate] = { nameCol: c, qtyCol: c + 1, unitCol: c + 2 };
                c += 2; // Skip quantity and unit columns
            }
        }
    }
    
    const parsedMenu = {};
    Object.keys(dateCols).forEach(dStr => {
        const cols = dateCols[dStr];
        parsedMenu[dStr] = {
            counts: null,
            snack_name: null,
            calculations: { lunch: [], dinner: [] }
        };
        
        let currentCat = null;
        let currentCourse = null;
        
        // Lunch: Row 5 to 34 (0-indexed is 4 to 33)
        for (let r = 4; r < 34; r++) {
            const catCell = sheet[XLSX.utils.encode_cell({r: r, c: 1})];
            if (catCell && catCell.v) currentCat = String(catCell.v).trim();
            
            const nameCell = sheet[XLSX.utils.encode_cell({r: r, c: cols.nameCol})];
            const qtyCell = sheet[XLSX.utils.encode_cell({r: r, c: cols.qtyCol})];
            const unitCell = sheet[XLSX.utils.encode_cell({r: r, c: cols.unitCol})];
            
            if (nameCell && nameCell.v !== null) {
                let nameStr = String(nameCell.v).trim();
                if (qtyCell && qtyCell.v !== null) {
                    if (nameStr.startsWith("(") || nameStr.includes("沾") || nameStr.includes("裹") || nameStr.includes("醃")) continue;
                    
                    parsedMenu[dStr].calculations.lunch.push({
                        category: currentCat,
                        course: currentCourse,
                        name: nameStr,
                        raw_qty_per_person: qtyCell.v,
                        unit: unitCell ? String(unitCell.v).trim() : "克"
                    });
                } else {
                    if (!nameStr.startsWith("(") && !nameStr.includes("每隻") && !nameStr.includes("沾") && !nameStr.includes("裹") && !nameStr.includes("醃")) {
                        currentCourse = nameStr;
                    }
                }
            }
        }
        
        // Snack: Row 35 (0-indexed)
        const snackCell = sheet[XLSX.utils.encode_cell({r: 35, c: cols.nameCol})];
        parsedMenu[dStr].snack_name = snackCell && snackCell.v ? String(snackCell.v).trim() : null;
        
        // Dinner: Row 37 to 72 (0-indexed: 36 to 71)
        currentCat = null;
        currentCourse = null;
        for (let r = 36; r < 72; r++) {
            const catCell = sheet[XLSX.utils.encode_cell({r: r, c: 1})];
            if (catCell && catCell.v) currentCat = String(catCell.v).trim();
            
            const nameCell = sheet[XLSX.utils.encode_cell({r: r, c: cols.nameCol})];
            const qtyCell = sheet[XLSX.utils.encode_cell({r: r, c: cols.qtyCol})];
            const unitCell = sheet[XLSX.utils.encode_cell({r: r, c: cols.unitCol})];
            
            if (nameCell && nameCell.v !== null) {
                let nameStr = String(nameCell.v).trim();
                if (qtyCell && qtyCell.v !== null) {
                    if (nameStr.startsWith("(") || nameStr.includes("沾") || nameStr.includes("裹") || nameStr.includes("醃")) continue;
                    
                    parsedMenu[dStr].calculations.dinner.push({
                        category: currentCat,
                        course: currentCourse,
                        name: nameStr,
                        raw_qty_per_person: qtyCell.v,
                        unit: unitCell ? String(unitCell.v).trim() : "克"
                    });
                } else {
                    if (!nameStr.startsWith("(") && !nameStr.includes("每隻") && !nameStr.includes("沾") && !nameStr.includes("裹") && !nameStr.includes("醃")) {
                        currentCourse = nameStr;
                    }
                }
            }
        }
    });
    
    menuData = parsedMenu;
    activeDates = Object.keys(parsedMenu).sort();
    
    if (activeDates.length > 0) {
        activeSingleDate = activeDates[0];
        checkedDates = [activeDates[0]];
    }
    
    activeDates.forEach(d => {
        if (!vegSelections[d]) {
            vegSelections[d] = "青江菜";
        }
    });
    
    setViewMode(activeTab);
}

function handleCountsUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            
            const sheetName = workbook.SheetNames.find(n => n.includes("統計") || n.includes("月") || n.includes("表"));
            if (!sheetName) {
                alert("人數 Excel 中找不到含有 '統計'、'月' 或 '表' 的工作表！");
                return;
            }
            
            const sheet = workbook.Sheets[sheetName];
            if (!sheet || !sheet['!ref']) {
                alert("所選的人數 Excel 工作表為空或格式不正確，無法讀取範圍！");
                return;
            }
            const range = XLSX.utils.decode_range(sheet['!ref']);
            const maxRow = range.e.r + 1;
            const maxCol = range.e.c + 1;
            
            // Locate sections
            let dinnerSectionRow = maxRow;
            for (let r = 0; r < maxRow; r++) {
                const cell = sheet[XLSX.utils.encode_cell({r: r, c: 0})];
                if (cell && cell.v && String(cell.v).includes("晚餐")) {
                    dinnerSectionRow = r;
                    break;
                }
            }
            
            const findRowIndex = (startRow, endRow, keyword) => {
                for (let r = startRow; r < endRow; r++) {
                    const cell = sheet[XLSX.utils.encode_cell({r: r, c: 0})];
                    if (cell && cell.v && String(cell.v).replace(/\s+/g, '').includes(keyword)) {
                        return r;
                    }
                }
                return -1;
            };
            
            // Lunch Rows
            const rLunchZhao = findRowIndex(0, dinnerSectionRow, "綜照");
            const rLunchFu = findRowIndex(0, dinnerSectionRow, "光復送餐");
            const rLunchSui = findRowIndex(0, dinnerSectionRow, "瑞穗/玉里");
            const rLunchMa = findRowIndex(0, dinnerSectionRow, "馬太鞍");
            const rLunchOther = findRowIndex(0, dinnerSectionRow, "其他");
            
            // Dinner Rows
            const rDinnerFu = findRowIndex(dinnerSectionRow, maxRow, "光復送餐");
            const rDinnerSui = findRowIndex(dinnerSectionRow, maxRow, "瑞穗/玉里");
            const rDinnerOther = findRowIndex(dinnerSectionRow, maxRow, "兒童") !== -1 ? findRowIndex(dinnerSectionRow, maxRow, "兒童") : findRowIndex(dinnerSectionRow, maxRow, "其他");
            
            const parsedCounts = {};
            
            for (let c = 2; c < maxCol; c++) {
                const dayCell = sheet[XLSX.utils.encode_cell({r: 1, c: c})];
                if (dayCell && dayCell.v !== null) {
                    const dayNum = parseInt(dayCell.v);
                    if (!isNaN(dayNum) && dayNum >= 1 && dayNum <= 31) {
                        const readInt = (r) => {
                            if (r === -1) return 0;
                            const cell = sheet[XLSX.utils.encode_cell({r: r, c: c})];
                            if (cell && cell.v !== null) {
                                const val = parseInt(cell.v);
                                return isNaN(val) ? 0 : val;
                            }
                            return 0;
                        };
                        
                        // Mid-day
                        const mid_zhao_user = rLunchZhao !== -1 ? readInt(rLunchZhao) : 0;
                        const mid_zhao_staff = rLunchZhao !== -1 ? readInt(rLunchZhao + 1) : 0;
                        const mid_fu_user = rLunchFu !== -1 ? readInt(rLunchFu) : 0;
                        const mid_fu_vol = rLunchFu !== -1 ? readInt(rLunchFu + 1) : 0;
                        const mid_sui_user = rLunchSui !== -1 ? readInt(rLunchSui) : 0;
                        const mid_sui_vol = rLunchSui !== -1 ? readInt(rLunchSui + 1) : 0;
                        const mid_ma_user = rLunchMa !== -1 ? readInt(rLunchMa) : 0;
                        const mid_ma_staff = rLunchMa !== -1 ? readInt(rLunchMa + 1) : 0;
                        const mid_ma_vol = rLunchMa !== -1 ? readInt(rLunchMa + 2) : 0;
                        const mid_other_staff = rLunchOther !== -1 ? readInt(rLunchOther) : 0;
                        const mid_other_test = rLunchOther !== -1 ? readInt(rLunchOther + 1) : 0;
                        
                        // Dinner
                        const din_fu_user = rDinnerFu !== -1 ? readInt(rDinnerFu) : 0;
                        const din_fu_vol = rDinnerFu !== -1 ? readInt(rDinnerFu + 1) : 0;
                        const din_sui_user = rDinnerSui !== -1 ? readInt(rDinnerSui) : 0;
                        const din_sui_vol = rDinnerSui !== -1 ? readInt(rDinnerSui + 1) : 0;
                        const din_other_user = rDinnerOther !== -1 ? readInt(rDinnerOther) : 0;
                        const din_other_vol = rDinnerOther !== -1 ? readInt(rDinnerOther + 1) : 0;
                        
                        parsedCounts[dayNum] = {
                            lunch: {
                                group1: (mid_zhao_user + mid_zhao_staff) + (mid_fu_user + mid_fu_vol),
                                group2: mid_ma_user + mid_ma_staff + mid_ma_vol,
                                group3: (mid_sui_user + mid_sui_vol) + (mid_other_staff + mid_other_test)
                            },
                            dinner: {
                                group1: din_fu_user + din_fu_vol + din_other_user + din_other_vol,
                                group2: 0,
                                group3: din_sui_user + din_sui_vol
                            }
                        };
                    }
                }
            }
            
            countsData = parsedCounts;
            alert("人數統計 Excel 匯入成功！已對應各日用餐人數。");
            render();
        } catch(err) {
            console.error(err);
            alert("人數 Excel 解析失敗，請確認檔案格式是否正確。");
        }
    };
    reader.readAsArrayBuffer(file);
}

function getWasteRate(name) {
    let cname = String(name).trim();
    cname = cname.replace(/\(.*?\)/g, '').trim();
    if (cname in WASTE_RATES) {
        return WASTE_RATES[cname];
    }
    for (let k in WASTE_RATES) {
        if (cname.includes(k)) {
            return WASTE_RATES[k];
        }
    }
    if (cname.includes("菜") || cname.includes("菇")) return 0.10;
    if (cname.includes("肉") || cname.includes("魚") || cname.includes("雞")) return 0.00;
    return 0.00;
}

function getSupplier(ingName) {
    if (!ingName) return "調味雜貨與其他";
    const name = String(ingName).trim();
    
    // Specific overrides:
    if (name.includes("胡椒鹽") || name.includes("烤肉醬") || name.includes("皮蛋")) {
        return "調味雜貨與其他";
    }
    if (name.includes("黃豆芽") || name.includes("西芹") || name.includes("芋頭") || name.includes("碗豆莢") || name.includes("豌豆莢") || name.includes("鳳梨")) {
        return "蔬果類 (花蓮市農會)";
    }
    if (name.includes("三節翅") || name.includes("棒棒腿")) {
        return "水產冷凍 (洋貞農水產行)";
    }
    
    // 米類 -> 永興商行
    if (name.includes("米") || name.includes("燕麥") || name.includes("藜麥")) {
        if (!name.includes("米血") && !name.includes("米酒") && !name.includes("蝦米") && !name.includes("玉米") && !name.includes("米粉")) {

    if (name.includes("雞") || name.includes("魚") || name.includes("海鮮") || name.includes("魷魚") || 
        name.includes("蛤") || name.includes("蝦") || name.includes("花枝") || name.includes("海帶") || 
        name.includes("海茸") || name.includes("魚板") || name.includes("蟳味棒") || name.includes("冷凍")) {
        if (!name.includes("雞蛋")) {
            return "水產冷凍 (洋貞農水產行)";
        }
    }
    
    // 豬肉及其製品 -> 公正商號
    if (name.includes("肉") || name.includes("排骨") || name.includes("貢丸") || name.includes("香腸") ||

        return "豬肉製品 (公正商號)";

    // 蛋、黃豆製品、麵類 -> 華峰果菜行
    if (name.includes("蛋") || name.includes("豆腐") || name.includes("豆乾") || name.includes("豆干") || 
        name.includes("豆皮") || name.includes("麵") || name.includes("冬粉") || name.includes("麵腸") || 
        name.includes("麵筋") || name.includes("麵輪") || name.includes("豆包")) {
        return "黃豆麵蛋 (華峰果菜行)";
    }
    
    // 蔬果 -> 花蓮市農會
    const vegKeywords = [
        "菜", "菇", "瓜", "筍", "蘿蔔", "椒", "黃瓜", "茄子", "地瓜", "山藥", "洋芋", "馬鈴薯", "牛蒡", 
        "蔥", "蒜", "薑", "香菜", "九層塔", "四季豆", "豌豆", "甜豆", "秋葵", "蘆筍", "芹菜", "三色豆",

    ];
    for (let kw of vegKeywords) {
        if (name.includes(kw)) {
            return "蔬果類 (花蓮市農會)";

function handleQuotationUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = function(e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            
            // Find vegetable sheet
            const sheetName = workbook.SheetNames.find(n => n.includes("蔬菜") || n.includes("報價") || n.includes("菜")) || workbook.SheetNames[0];
            const sheet = workbook.Sheets[sheetName];
            if (!sheet || !sheet['!ref']) {
                alert("報價單中找不到有效的工作表！");
                return;
            }
            
            const range = XLSX.utils.decode_range(sheet['!ref']);
            const maxRow = range.e.r + 1;
            const maxCol = range.e.c + 1;
            
            // Scan for header row with exact "品名" or "名稱"
            let nameCol = 1;
            let startRow = 3;
            let foundHeader = false;
            
            for (let r = 0; r < Math.min(10, maxRow); r++) {
                for (let c = 0; c < maxCol; c++) {
                    const cell = sheet[XLSX.utils.encode_cell({r, c})];
                    if (cell && cell.v) {
                        const val = String(cell.v).trim();
                        if (val === "品名" || val === "名稱" || val === "食材品項" || val === "菜名" || (val.includes("品名") && val.length <= 4)) {
                            nameCol = c;
                            startRow = r + 1;
                            foundHeader = true;
                            break;
                        }
                    }
                }
                if (foundHeader) break;
            }
            
            const newOptions = {};
            let count = 0;
            
            for (let r = startRow; r < maxRow; r++) {
                const nameCell = sheet[XLSX.utils.encode_cell({r, c: nameCol})];
                const col0Cell = sheet[XLSX.utils.encode_cell({r, c: 0})];
                
                if (nameCell && nameCell.v) {
                    const rawName = String(nameCell.v).trim();
                    // Stop if reaching footer notes
                    if (rawName.startsWith("備") || rawName.startsWith("廠") || rawName.startsWith("總計") || rawName.includes("不可抗力")) {
                        break;
                    }
                    if (col0Cell && col0Cell.v && (String(col0Cell.v).startsWith("備") || String(col0Cell.v).startsWith("廠"))) {
                        break;
                    }
                    
                    if (rawName.length > 0 && isNaN(Number(rawName))) {
                        let wasteRate = 0.10; // default 10%
                        if (WASTE_RATES[rawName] !== undefined) {
                            wasteRate = WASTE_RATES[rawName];
                        } else {
                            for (let k in WASTE_RATES) {
                                if (rawName.includes(k) || k.includes(rawName)) {
                                    wasteRate = WASTE_RATES[k];
                                    break;
                                }
                            }
                        }
                        newOptions[rawName] = wasteRate;
                        count++;
                    }
                }
            }
            
            if (count === 0) {
                alert("未能在上傳的報價單中解析出品名，請確認檔案格式是否正確。");
                return;
            }
            
            // Clear existing and assign new options
            for (let k in VEG_OPTIONS) {
                delete VEG_OPTIONS[k];
            }
            Object.assign(VEG_OPTIONS, newOptions);
            
            // Update vegSelections if current choice is not in new list
            const firstVeg = Object.keys(VEG_OPTIONS)[0];
            Object.keys(vegSelections).forEach(d => {
                if (!VEG_OPTIONS[vegSelections[d]]) {
                    vegSelections[d] = firstVeg;
                }
            });
            
            // Update status UI
            const statusTextEl = document.getElementById('quotation-status-text');
            const countBadgeEl = document.getElementById('quotation-count-badge');
            if (statusTextEl) {
                statusTextEl.innerHTML = `<i class="fa-solid fa-circle-check" style="color: var(--success); margin-right: 5px;"></i>已匯入 ${file.name || sheetName}`;
            }
            if (countBadgeEl) {
                countBadgeEl.innerText = `${count} 項蔬菜`;
            }
            
            // Re-render selectors and procurement table
            renderVegSelectors();
            renderTable();
            
            alert(`蔬菜報價單 Excel 匯入成功！已載入 ${count} 項蔬菜供季節蔬菜選擇。`);
        } catch(err) {
            console.error(err);
            alert("報價單 Excel 解析失敗，請確認檔案格式是否正確。");
        }
    };
    reader.readAsArrayBuffer(file);
}

function formatQuantity(grams, unit) {
    if (unit === '顆' || unit === '隻' || unit === '片') {
        return { val: Math.round(grams), unit: unit };
    }
    
    if (activeUnit === 'taijin') {
        const taijin = grams / 600;
        return { val: taijin.toFixed(1), unit: '台斤' };
    } else {
        if (grams >= 1000) {
            const kg = grams / 1000;
            return { val: kg.toFixed(1), unit: '公斤' };
        }
        return { val: Math.round(grams), unit: '克' };
    }
}

function processIngredient(ing, date, mealType, counts) {
    let name = String(ing.name).trim();
    let rawQty = ing.raw_qty_per_person;
    let unit = String(ing.unit).trim();
    
    // Unify liquid seasoning units from c.c. / ml to 克 (grams) to eliminate duplicate rows
    if (unit === "c.c." || unit === "C.C" || unit === "cc" || unit === "CC" || unit === "ml" || unit === "ML") {
        unit = "克";
    }
    
    // Normalization rules:
    if (name === "豆干丁" || name === "豆乾丁") {
        name = "豆乾";
    }
    if (name === "四季豆丁" || name === "四季豆段" || name === "四季豆片") {
        name = "四季豆";
    }
    const eggNames = ["蛋酥", "蛋絲", "蛋", "滷蛋", "白煮蛋(切碎)", "蛋花", "散蛋", "荷包蛋", "雞蛋"];
    if (eggNames.includes(name)) {
        name = "雞蛋";
        if (unit === "克" || unit === "g") {
            rawQty = rawQty / 55;
        }
        unit = "顆";
    }
    if (name === "鹹蛋丁" || name === "鹹蛋碎") {
        name = "鹹蛋";
    }
    if (name === "鹹蛋") {
        if (unit === "克" || unit === "g") {
            rawQty = rawQty / 55;
            unit = "顆";
        }
    }
    if (name === "皮蛋丁") {
        name = "皮蛋";
    }
    if (name === "蔥花" || name === "蔥段" || name === "蔥絲") {
        name = "蔥";
    }
    if (name === "辣椒末") {
        name = "辣椒";
    }
    if (name === "蒜") {
        name = "蒜頭";
    }
    if (name === "薑片" || name === "薑末" || name === "薑絲") {
        name = "薑";
    }
    if (name === "雞柳條" || name === "雞胸肉片" || name === "雞胸肉丁") {
        name = "雞胸肉";
    }
    if (name === "小黃瓜片" || name === "小黃瓜絲") {
        name = "小黃瓜";
    }
    if (name === "木耳片" || name === "木耳絲" || name === "木耳丁") {
        name = "木耳";
    }
    if (name === "洋蔥(小丁)" || name === "洋蔥丁") {
        name = "洋蔥";
    }
    if (name === "紅蘿蔔丁" || name === "紅蘿蔔片" || name === "紅蘿蔔絲") {
        name = "紅蘿蔔";
    }
    if (name === "高麗菜絲") {
        name = "高麗菜";
    }
    if (name === "鳳梨片") {
        name = "鳳梨";
    }
    
    let wasteRate = getWasteRate(name);
    
    if (name === "綠色蔬菜" || name.includes("季節蔬菜")) {
        const chosenVeg = vegSelections[date];
        name = `綠色蔬菜 (選用: ${chosenVeg})`;
        wasteRate = VEG_OPTIONS[chosenVeg];
    }
    
    if (name === "白飯") {
        name = "白米";
        rawQty = Math.round((rawQty / 1.92) * 100) / 100;
        wasteRate = 0.0;
    }
    
    let breakdown = {};
    const mealCounts = counts[mealType];
    
    Object.keys(mealCounts).forEach(g => {
        const c = mealCounts[g];
        if (c > 0) {
            let qty = 0.0;
            if (unit === '顆' || unit === '隻' || unit === '片') {
                qty = rawQty * c;
            } else {
                qty = (rawQty * c) / (1 - wasteRate);
            }
            breakdown[g] = Math.round(qty * 10) / 10;
        } else {
            breakdown[g] = 0.0;
        }
    });
    
    const totalNeed = Math.round(Object.values(breakdown).reduce((a, b) => a + b, 0) * 10) / 10;
    
    return {
        category: ing.category,
        course: ing.course,
        name: name,
        raw_qty_per_person: rawQty,
        unit: unit,
        waste_rate: wasteRate,
        breakdown: breakdown,
        total_need: totalNeed
    };
}

function generateAcceptanceSheet() {
    let targetDates = [];
    let dateTitle = "";
    if (activeTab === 'daily') {
        if (!activeSingleDate || !menuData[activeSingleDate]) {
            alert("當前無可產出驗收表的日期資料！");
            return;
        }
        targetDates = [activeSingleDate];
        const parts = activeSingleDate.split('-');
        const yearStr = parts[0];
        const monthStr = parseInt(parts[1]);
        const dayStr = parts[2];
        const dayName = getChineseDayName(activeSingleDate);
        dateTitle = `${yearStr}年${monthStr}月${dayStr}日 (${dayName})`;
    } else {
        if (!checkedDates || checkedDates.length === 0) {
            alert("請先在畫面中勾選要產出驗收表的日期！");
            return;
        }
        targetDates = checkedDates;
        const firstD = checkedDates[0];
        const lastD = checkedDates[checkedDates.length - 1];
        dateTitle = `${firstD} 至 ${lastD} (合計共 ${checkedDates.length} 天)`;
    }

    const groupsMap = {};
    
    targetDates.forEach(d => {
        const dayData = menuData[d];
        if (!dayData) return;
        const counts = getCountsForDate(d);
        
        const processMeal = (mealType) => {
            if (!dayData.calculations || !dayData.calculations[mealType]) return;
            dayData.calculations[mealType].forEach(rawIng => {
                const p = processIngredient(rawIng, d, mealType, counts);
                if (!p.breakdown) return;
                
                const itemKey = `${p.name}_${p.unit}`;
                const supplier = getSupplier(p.name);
                
                Object.keys(p.breakdown).forEach(gKey => {
                    const qty = p.breakdown[gKey] || 0;
                    if (qty <= 0) return;
                    
                    if (!groupsMap[gKey]) {
                        let displayName = gKey;
                        if (gKey.includes('光福日照') || gKey.includes('光復送餐')) displayName = '群組一 (光福日照 + 光復送餐)';
                        else if (gKey.includes('馬太鞍')) displayName = '群組二 (馬太鞍據點)';
                        else if (gKey.includes('瑞穗') || gKey.includes('玉里')) displayName = '群組三 (瑞穗/玉里送餐 + 其他)';
                        else if (gKey.includes('鳳福') || gKey.includes('鳳林')) displayName = '群組一 (鳳福綜照 + 鳳林送餐 + 其他)';
                        else if (gKey.includes('鳳中')) displayName = '群組二 (鳳中據點)';
                        else if (gKey.includes('樹湖')) displayName = '群組三 (樹湖據點)';
                        else if (gKey.includes('福興')) displayName = '群組四 (福興據點)';
                        else displayName = gKey.replace(/_/g, ' ');
                        
                        groupsMap[gKey] = {
                            key: gKey,
                            name: displayName,
                            items: {}
                        };
                    }
                    
                    if (!groupsMap[gKey].items[itemKey]) {
                        groupsMap[gKey].items[itemKey] = {
                            name: p.name,
                            unit: p.unit,
                            supplier: supplier,
                            qty: 0
                        };
                    }
                    groupsMap[gKey].items[itemKey].qty += qty;
                });
            });
        };
        
        processMeal('lunch');
        processMeal('dinner');
    });

    const groupKeys = Object.keys(groupsMap).sort((a, b) => {
        const getGroupNum = (str) => {
            if (str.includes('群組一')) return 1;
            if (str.includes('群組二')) return 2;
            if (str.includes('群組三')) return 3;
            if (str.includes('群組四')) return 4;
            return 99;
        };
        return getGroupNum(a) - getGroupNum(b);
    });

    if (groupKeys.length === 0) {
        alert("所選日期各群組無叫貨資料，無法產出驗收表！");
        return;
    }

    groupKeys.forEach(gk => {
        const grp = groupsMap[gk];
        grp.itemList = Object.values(grp.items);
        grp.itemList.sort((a, b) => {
            const diff = VENDOR_ORDER.indexOf(a.supplier) - VENDOR_ORDER.indexOf(b.supplier);
            if (diff !== 0) return diff;
            return a.name.localeCompare(b.name, "zh-Hant-TW");
        });
    });

    const win = window.open('', '_blank');
    if (!win) {
        alert("彈出視窗被瀏覽器阻擋，請在瀏覽器設定中允許開啟彈出視窗後重試！");
        return;
    }

    const pagesHtml = groupKeys.map((gk, gIdx) => {
        const grp = groupsMap[gk];
        const rowsHtml = grp.itemList.map((item, i) => {
            const fmt = formatQuantity(item.qty, item.unit);
            return `
                <tr>
                    <td class="col-check">
                        <label class="check-box-label"><span class="print-check-box"></span><input type="checkbox" class="check-input"> 合格</label>
                        <label class="check-box-label"><span class="print-check-box"></span><input type="checkbox" class="check-input"> 不合格</label>
                    </td>
                    <td class="col-vendor">${item.supplier}</td>
                    <td class="col-name">${item.name}</td>
                    <td class="col-qty">${fmt.val} ${fmt.unit}</td>
                    <td class="col-note">☐包裝完整 ☐無異味 ☐效期內</td>
                </tr>
            `;
        }).join('');

        const pageBreakHtml = (gIdx > 0) ? '<div class="print-page-break"></div>' : '';

        return `
            ${pageBreakHtml}
            <div class="group-page">
                <div class="header-card">
                    <div class="org-name">財團法人一粒麥子社會福利慈善事業基金會</div>
                    <div class="main-title">食材進貨驗收紀錄表</div>
                    <div class="meta-grid">
                        <div><b>受驗群組：</b><span class="group-name-highlight">${grp.name}</span></div>
                        <div><b>驗收日期：</b>${dateTitle}</div>
                        <div><b>製表時間：</b>${new Date().toLocaleDateString('zh-TW')} ${new Date().toLocaleTimeString('zh-TW', {hour: '2-digit', minute:'2-digit'})}</div>
                    </div>
                </div>

                <table class="report-table">
                    <thead>
                        <tr>
                            <th style="width: 120px; text-align: center;">驗收判定</th>
                            <th style="width: 150px; text-align: left;">採購廠商</th>
                            <th style="text-align: left;">食材品項</th>
                            <th style="width: 85px; text-align: right;">叫貨數量</th>
                            <th style="width: 210px; text-align: center;">規格 / 狀態檢查</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${rowsHtml || '<tr><td colspan="5" style="text-align:center; padding:20px; color:#888;">此群組本日無叫貨品項</td></tr>'}
                    </tbody>
                </table>

                <div class="footer-sign">
                    <div><b>驗收人員簽章：</b>____________________</div>
                    <div><b>驗收時間：</b>____時____分</div>
